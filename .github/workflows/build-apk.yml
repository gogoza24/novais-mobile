name: NOVAIS Mobile APK Derle

# Kod bu depoya her yuklendiginde (push) VEYA GitHub arayuzunden manuel
# tetiklendiginde (workflow_dispatch) calisir. Bilgisayar/Android Studio
# gerektirmez — derleme tamamen GitHub'in kendi bulut sunucusunda yapilir.
"on":
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: gradlew calistirilabilir yap
        run: chmod +x ./gradlew

      - name: Debug APK derle
        run: ./gradlew assembleDebug --stacktrace

      - name: APK'yi indirilebilir yap (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: NOVAIS-Mobile-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
