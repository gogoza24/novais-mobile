name: NOVAIS Mobile APK Derle

# Kod bu depoya her yuklendiginde (push) VEYA GitHub arayuzunden manuel
# tetiklendiginde (workflow_dispatch) calisir. Bilgisayar/Android Studio
# gerektirmez — derleme tamamen GitHub'in kendi bulut sunucusunda yapilir.
"on":
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: gradlew calistirilabilir yap
        run: chmod +x ./gradlew

      - name: Debug APK derle
        id: build
        continue-on-error: true
        run: ./gradlew assembleDebug --stacktrace > build_output.log 2>&1

      - name: Basarisizsa hata logunu depoya yaz
        if: steps.build.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build_output.log
          git commit -m "Derleme hata logu"
          git push
          exit 1

      - name: APK'yi indirilebilir yap (artifact)
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: NOVAIS-Mobile-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
